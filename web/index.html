<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大肥鱼直播间</title>

  <link rel="preload" as="image" href="/bg_aquarium.jpg" />
  <link rel="preload" as="image" href="/dafeiyu_cute_fish.webp" />
  <link rel="preload" as="image" href="/dafeiyu_girl_3d_transparent.webp" />

  <script type="importmap">
    {
      "imports": {
        "three": "/3d/three.module.js",
        "three/addons/": "/3d/"
      }
    }
  </script>
  <script type="module" src="/3d/character_dance.js"></script>

  <style>
    :root {
      --bg-surface: rgba(11, 16, 24, 0.72);
      --bg-surface-strong: rgba(11, 16, 24, 0.86);
      --border-hairline: rgba(255, 255, 255, 0.1);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.16);
      --danger: #ef4444;
      --gold: #f59e0b;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070b12 url('/bg_aquarium.jpg') no-repeat center center / cover;
      color: var(--text-primary);
      position: relative;
      transition: background-color 0.25s ease;
    }

    body.bg-green {
      background: #00b140 !important;
    }
    body.bg-green .cinematic-vignette,
    body.bg-green .stage-party-lights {
      display: none !important;
    }

    body.bg-transparent {
      background: transparent !important;
    }
    body.bg-transparent .cinematic-vignette {
      display: none !important;
    }

    .cinematic-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 48%, rgba(7, 11, 18, 0.04) 0%, rgba(7, 11, 18, 0.35) 75%, rgba(7, 11, 18, 0.72) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .stage-party-lights {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.5s ease;
      background:
        radial-gradient(circle at 25% 20%, rgba(56, 189, 248, 0.18), transparent 45%),
        radial-gradient(circle at 75% 20%, rgba(244, 63, 94, 0.18), transparent 45%);
    }
    .stage-party-lights.active {
      opacity: 1;
    }

    .panel {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
    }

    .icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* =========================================================
       左上角：主播信息与成长进度 / 榜一
       ========================================================= */
    .hud-top-left {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 300px;
    }

    .streamer-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px 8px 8px;
      border-radius: 999px;
    }

    .streamer-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: #0f172a;
      border: 1.5px solid rgba(56, 189, 248, 0.5);
    }

    .streamer-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 140px;
    }

    .streamer-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #fecaca;
      background: rgba(239, 68, 68, 0.22);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--danger);
      animation: pulseDot 1.6s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .evo-subline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      gap: 8px;
    }

    .evo-track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 2px;
    }

    .evo-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .rank-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      width: fit-content;
    }

    .rank-label {
      color: var(--gold);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .rank-user {
      color: var(--text-primary);
      font-weight: 500;
    }

    .rank-score {
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
    }

    /* =========================================================
       右上角：音乐播放与点歌队列
       ========================================================= */
    .hud-top-right {
      position: absolute;
      top: 18px;
      right: 20px;
      z-index: 30;
      width: 268px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .music-card {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .music-now-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .vinyl-disc {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle, #1e293b 32%, #090d14 35%, #1e293b 65%, #090d14 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      animation: spinDisc 6s linear infinite;
      animation-play-state: paused;
    }

    .vinyl-disc-core {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .music-info {
      flex: 1;
      min-width: 0;
    }

    .music-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-requester {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .audio-eq {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      padding-bottom: 2px;
    }

    .eq-bar {
      width: 2.5px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
      transition: height 0.2s ease;
    }

    .audio-eq.playing .eq-bar:nth-child(1) { animation: eqBounce 0.7s infinite alternate 0.0s; }
    .audio-eq.playing .eq-bar:nth-child(2) { animation: eqBounce 0.7s infinite alternate 0.2s; }
    .audio-eq.playing .eq-bar:nth-child(3) { animation: eqBounce 0.7s infinite alternate 0.4s; }
    .audio-eq.playing .eq-bar:nth-child(4) { animation: eqBounce 0.7s infinite alternate 0.1s; }

    @keyframes eqBounce {
      from { height: 3px; opacity: 0.5; }
      to { height: 14px; opacity: 1; }
    }

    .queue-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.07);
    }

    .queue-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .queue-count {
      color: var(--accent);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 96px;
      overflow-y: auto;
    }

    .queue-list::-webkit-scrollbar { width: 3px; }
    .queue-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }

    .queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
    }

    .queue-item-name {
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 150px;
    }

    .queue-item-user {
      color: var(--text-secondary);
      font-size: 11px;
    }

    .queue-empty-tip {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .quick-songs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .song-chip {
      font-size: 11px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 3px 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .song-chip:hover {
      color: var(--text-primary);
      background: var(--accent-soft);
      border-color: rgba(56, 189, 248, 0.35);
    }

    /* =========================================================
       左下角：实时弹幕瀑布流（去重边框，纯直播流质感）
       ========================================================= */
    .danmu-waterfall {
      position: absolute;
      left: 20px;
      bottom: 84px;
      width: 320px;
      max-height: 220px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 26%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 26%);
    }

    body.clean-mode .danmu-waterfall {
      bottom: 32px;
    }

    .danmu-item {
      background: rgba(11, 16, 24, 0.56);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.45;
      width: fit-content;
      max-width: 100%;
      word-break: break-word;
      animation: danmuSlideIn 0.22s ease-out;
    }

    @keyframes danmuSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .danmu-user {
      color: var(--accent);
      font-weight: 600;
      margin-right: 6px;
    }

    .danmu-item.is-gift {
      border-color: rgba(245, 158, 11, 0.35);
      background: rgba(245, 158, 11, 0.14);
    }
    .danmu-item.is-gift .danmu-user {
      color: var(--gold);
    }

    .danmu-item.is-join .danmu-user {
      color: #64748b;
    }
    .danmu-item.is-join {
      color: #cbd5e1;
      font-size: 12px;
    }

    /* =========================================================
       居中核心舞台：3D舞娘 + 萌鱼形象
       ========================================================= */
    .stage-viewport {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .avatar-parallax-wrapper {
      position: absolute;
      left: 25%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      transition: left 0.4s ease, opacity 0.3s ease, transform 0.4s ease;
    }

    .anime-avatar-frame {
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      animation: fishFloat 4.5s ease-in-out infinite;
    }

    .anime-avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.4));
      transition: transform 0.15s ease-out;
    }

    @keyframes fishFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .anime-avatar-frame.whale-talking {
      animation: whaleTalk 0.28s ease-in-out infinite alternate;
    }

    @keyframes whaleTalk {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-8px) scale(1.03); }
    }

    .girl-vtuber-frame {
      position: absolute;
      left: 58%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: 560px;
      height: 82vh;
      max-height: 760px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      transition: left 0.4s ease, opacity 0.3s ease;
    }

    #threeStageCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .girl-vtuber-frame img {
      height: 100%;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 18px 32px rgba(0, 0, 0, 0.45));
      transition: transform 0.15s ease-out;
    }

    .girl-vtuber-frame.girl-talking {
      animation: girlTalk 0.35s ease-in-out infinite alternate;
    }

    @keyframes girlTalk {
      from { transform: translate(-50%, -50%) scale(1); }
      to { transform: translate(-50%, -50.8%) scale(1.012); }
    }

    .girl-vtuber-frame.girl-dancing {
      animation: girlDance2D 0.6s ease-in-out infinite alternate;
    }

    @keyframes girlDance2D {
      0% { transform: translate(-50%, -50%) rotate(-2deg) scale(1.01); }
      100% { transform: translate(-50%, -52%) rotate(2deg) scale(1.03); }
    }

    /* 展示模式切换 */
    body.mode-fish .girl-vtuber-frame {
      opacity: 0;
      pointer-events: none;
    }
    body.mode-fish .avatar-parallax-wrapper {
      left: 50%;
    }

    body.mode-girl .avatar-parallax-wrapper {
      opacity: 0;
      pointer-events: none;
    }
    body.mode-girl .girl-vtuber-frame {
      left: 50%;
    }

    /* =========================================================
       底部居中：主播发言字幕
       ========================================================= */
    .subtitle-bar {
      position: absolute;
      left: 50%;
      bottom: 84px;
      transform: translateX(-50%);
      z-index: 28;
      max-width: 640px;
      width: max-content;
      min-width: 260px;
      padding: 10px 18px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.35s ease, bottom 0.3s ease;
    }

    body.clean-mode .subtitle-bar {
      bottom: 32px;
    }

    .subtitle-speaker {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .subtitle-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    /* =========================================================
       居中通知 & 猜歌挑战浮窗
       ========================================================= */
    .event-toast {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translate(-50%, -12px);
      z-index: 40;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .event-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .guess-banner {
      position: absolute;
      top: 112px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      width: 360px;
      padding: 12px 16px;
      display: none;
    }

    .guess-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .guess-timer {
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }

    .guess-hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .guess-bar-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .guess-bar-fill {
      width: 100%;
      height: 100%;
      background: var(--accent);
    }

    /* =========================================================
       右下角：实时时间（纯推流也保留，防录播误判）
       ========================================================= */
    .live-clock {
      position: absolute;
      right: 20px;
      bottom: 84px;
      z-index: 25;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: bottom 0.3s ease;
    }

    body.clean-mode .live-clock {
      bottom: 20px;
    }

    /* =========================================================
       底部控台（纯净推流模式下自动隐藏）
       ========================================================= */
    .operator-dock {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 14px;
      background: var(--bg-surface-strong);
      max-width: calc(100vw - 40px);
    }

    body.clean-mode .operator-dock {
      display: none !important;
    }

    .dock-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .dock-btn.active {
      background: var(--accent-soft);
      border-color: rgba(56, 189, 248, 0.45);
      color: #e0f2fe;
    }

    .dock-btn.btn-dance.active {
      background: rgba(239, 68, 68, 0.22);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fecaca;
    }

    .dock-btn.btn-audio-alert {
      background: rgba(245, 158, 11, 0.2);
      border-color: rgba(245, 158, 11, 0.45);
      color: #fde68a;
    }

    .dock-sep {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .dock-input {
      width: 210px;
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text-primary);
      font-size: 12px;
      outline: none;
      font-family: inherit;
    }

    .dock-input:focus {
      border-color: rgba(56, 189, 248, 0.55);
    }

    .dock-input::placeholder {
      color: #64748b;
    }

    .dock-send {
      height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #082f49;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: opacity 0.15s ease;
    }

    .dock-send:hover {
      opacity: 0.9;
    }

    /* 纯净模式下，右下角极简恢复按钮（悬停才显露） */
    .restore-ui-btn {
      display: none;
      position: absolute;
      right: 20px;
      bottom: 54px;
      z-index: 60;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      cursor: pointer;
      opacity: 0.18;
      transition: opacity 0.2s ease;
    }

    body.clean-mode .restore-ui-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .restore-ui-btn:hover {
      opacity: 0.95;
      color: var(--text-primary);
    }

    /* 响应式小屏适配（手机端局域网浏览） */
    @media (max-width: 900px) {
      .hud-top-right { width: 200px; }
      .danmu-waterfall { width: 230px; }
      .operator-dock {
        flex-wrap: wrap;
        justify-content: center;
        bottom: 10px;
      }
      .dock-input { width: 150px; }
      .subtitle-bar { max-width: 90vw; bottom: 106px; }
      .danmu-waterfall { bottom: 154px; }
    }
  </style>
</head>
<body class="mode-combo">
  <div class="cinematic-vignette"></div>
  <div class="stage-party-lights" id="stagePartyLights"></div>

  <!-- 1. 左上角：主播卡片 & 榜一 -->
  <div class="hud-top-left">
    <div class="panel streamer-pill">
      <img class="streamer-avatar" src="/dafeiyu_cute_fish.webp" alt="大肥鱼" onerror="this.src='/dafeiyu_cute_fish.png'" />
      <div class="streamer-meta">
        <div class="streamer-name-row">
          <span>大肥鱼</span>
          <span class="live-badge"><span class="live-dot"></span>LIVE</span>
        </div>
        <div class="evo-subline">
          <span id="evoLevelBadge">Lv.1 呆萌幼鲸</span>
          <span id="evoValText">180 / 500 斤</span>
        </div>
        <div class="evo-track">
          <div class="evo-fill" id="evoProgressFill" style="width: 36%;"></div>
        </div>
      </div>
    </div>

    <div class="panel rank-pill" id="championThrone" title="今日贡献榜首">
      <span class="rank-label">
        <svg class="icon" viewBox="0 0 24 24"><path d="M2 17l2-10 5 4 3-7 3 7 5-4 2 10H2z"></path></svg>
        榜一
      </span>
      <span class="rank-user" id="throneUser">虚位以待</span>
      <span class="rank-score" id="throneScore">0 鱼干</span>
    </div>
  </div>

  <!-- 2. 右上角：音乐播放器 & 点歌队列 -->
  <div class="hud-top-right">
    <div class="panel music-card">
      <div class="music-now-row">
        <div class="vinyl-disc" id="vinylDisc">
          <div class="vinyl-disc-core"></div>
        </div>
        <div class="music-info">
          <div class="music-title" id="nowPlayingSongName">治愈深海电台</div>
          <div class="music-requester" id="nowPlayingRequester">点击屏幕激活声音</div>
        </div>
        <div class="audio-eq" id="audioEq">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
        </div>
      </div>

      <div class="queue-divider"></div>

      <div class="queue-head">
        <span>点歌队列</span>
        <span class="queue-count" id="queueCountBadge">0 首</span>
      </div>

      <div class="queue-list" id="queueList">
        <div class="queue-empty-tip">公屏发「点歌 歌名」即可排队点播</div>
      </div>

      <div class="quick-songs" id="quickSongsBar">
        <button class="song-chip" onclick="quickPlaySong('晴天')">晴天</button>
        <button class="song-chip" onclick="quickPlaySong('夜曲')">夜曲</button>
        <button class="song-chip" onclick="quickPlaySong('稻香')">稻香</button>
        <button class="song-chip" onclick="quickPlaySong('极乐净土')">极乐净土</button>
      </div>
    </div>
  </div>

  <!-- 3. 居中核心舞台 -->
  <div class="stage-viewport" id="stageViewport">
    <div class="avatar-parallax-wrapper" id="avatarParallax">
      <div class="anime-avatar-frame" id="avatarFrame" title="点击互动">
        <img id="animeImage" src="/dafeiyu_cute_fish.webp" alt="大肥鱼" onerror="this.src='/dafeiyu_cute_fish.png'" />
      </div>
    </div>

    <div class="girl-vtuber-frame" id="girlFrame">
      <canvas id="threeStageCanvas"></canvas>
      <img id="girlImage" src="/dafeiyu_girl_3d_transparent.webp" alt="大肥鱼舞娘" style="display: none;" onerror="this.src='/dafeiyu_girl_3d_transparent.png'" />
    </div>
  </div>

  <!-- 4. 左下角：弹幕流 -->
  <div class="danmu-waterfall" id="danmuStream"></div>

  <!-- 5. 居中高光通知 & 猜歌 -->
  <div class="panel event-toast" id="liveEventToast">
    <span id="eventToastText"></span>
  </div>

  <div class="panel guess-banner" id="guessSongBanner">
    <div class="guess-head">
      <span>听前奏猜歌名</span>
      <span class="guess-timer" id="guessTimerText">20s</span>
    </div>
    <div class="guess-hint" id="guessHintText">提示：经典热门金曲</div>
    <div class="guess-bar-track">
      <div class="guess-bar-fill" id="guessProgressInner"></div>
    </div>
  </div>

  <!-- 6. 底部居中：主播台词字幕 -->
  <div class="panel subtitle-bar" id="douyinSubtitle">
    <span class="subtitle-speaker" id="subtitleSpeaker">大肥鱼</span>
    <span class="subtitle-text" id="douyinSubtitleText">欢迎来到大肥鱼直播间，公屏打「点歌 歌名」即可免费点播。</span>
  </div>

  <!-- 7. 右下角：实时时间 -->
  <div class="panel live-clock" id="liveClockBadge">
    <span class="live-dot"></span>
    <span id="liveClockTime">--:--:--</span>
  </div>

  <button class="panel restore-ui-btn" id="restoreUiBtn" onclick="toggleCleanMode()" title="恢复控制台 (H)">
    <svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    显示控台 (H)
  </button>

  <!-- 8. 底部控台（推流时可按 H 或点纯净推流一键隐藏） -->
  <div class="panel operator-dock" id="bottomDock">
    <button class="dock-btn btn-audio-alert" id="audioUnlockTip" onclick="unlockAudio()" title="点击开启声音与伴奏">
      <svg class="icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
      <span>激活声音</span>
    </button>

    <button class="dock-btn" id="switchDisplayModeBtn" title="切换画面布局">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
      <span>双模同台</span>
    </button>

    <button class="dock-btn active" id="switchAvatarEngineBtn" title="切换 3D 舞娘或原画形象">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7z"></path></svg>
      <span>3D舞娘</span>
    </button>

    <button class="dock-btn" id="switchBgBtn" title="切换实景/绿幕/透明背景">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      <span>背景: 实景</span>
    </button>

    <div class="dock-sep"></div>

    <button class="dock-btn btn-dance" id="danceBtn" title="开启极乐净土热舞">
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      <span>热舞</span>
    </button>

    <button class="dock-btn" id="triggerGuessBtn" title="发起猜歌">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      <span>猜歌</span>
    </button>

    <button class="dock-btn" id="feedFishBtn" title="投喂增加体重">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
      <span>投喂</span>
    </button>

    <button class="dock-btn" id="skipSongBtn" title="切到下一首">
      <svg class="icon" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
      <span>切歌</span>
    </button>

    <button class="dock-btn" id="broadcastRuleBtn" title="语音播报欢迎语">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
      <span>播报</span>
    </button>

    <button class="dock-btn" id="hideUiBtn" title="隐藏底部控台 (按 H 键恢复)">
      <svg class="icon" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
      <span>纯净推流</span>
    </button>

    <div class="dock-sep"></div>

    <input type="text" class="dock-input" id="msgInput" placeholder="发弹幕或输入「点歌 歌名」" />
    <button class="dock-send" id="sendBtn">发送</button>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    let ws = null;
    let audioUnlocked = false;
    let guessTimer = null;
    let currentGuessSong = null;

    let songQueue = [];
    let isPlayingSong = false;
    let currentPlayingSong = null;

    let displayModes = ['combo', 'girl', 'fish'];
    let currentModeIndex = 0;

    let bgModes = ['aquarium', 'green', 'transparent'];
    let currentBgIndex = 0;

    let ttsQueue = [];
    let isPlayingTts = false;
    let ttsAudio = new Audio();
    const audioPlayer = document.getElementById('audioPlayer');

    function setPlayingVisual(active) {
      const disc = document.getElementById('vinylDisc');
      const eq = document.getElementById('audioEq');
      if (disc) disc.style.animationPlayState = active ? 'running' : 'paused';
      if (eq) {
        if (active) eq.classList.add('playing');
        else eq.classList.remove('playing');
      }
    }

    function playDefaultMusic() {
      if (isPlayingSong) return;
      const defaultSong = {
        title: '晴天',
        artist: '周杰伦',
        url: '/local_music/%E6%99%B4%E5%A4%A9.mp3',
        user: '精选电台'
      };
      audioPlayer.src = defaultSong.url;
      audioPlayer.volume = 0.85;
      audioPlayer.play().then(() => {
        isPlayingSong = true;
        currentPlayingSong = defaultSong;
        setPlayingVisual(true);
        document.getElementById('nowPlayingSongName').innerText = defaultSong.title;
        document.getElementById('nowPlayingRequester').innerText = defaultSong.user;
      }).catch(() => {});
    }

    function unlockAudio() {
      audioUnlocked = true;
      const tip = document.getElementById('audioUnlockTip');
      if (tip) {
        tip.classList.remove('btn-audio-alert');
        tip.classList.add('active');
        const span = tip.querySelector('span');
        if (span) span.innerText = '声音已开';
      }
      if (audioPlayer && audioPlayer.src && audioPlayer.paused) {
        audioPlayer.play().then(() => setPlayingVisual(true)).catch(() => {});
      } else if (!isPlayingSong) {
        playDefaultMusic();
      }
    }
    document.addEventListener('click', unlockAudio, { once: true });
    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('keydown', unlockAudio, { once: true });

    function playTtsAudio(audioUrl) {
      if (!audioUrl) return;
      ttsQueue.push(audioUrl);
      processTtsQueue();
    }

    function processTtsQueue() {
      if (isPlayingTts || ttsQueue.length === 0) return;
      isPlayingTts = true;
      const url = ttsQueue.shift();

      ttsAudio.src = url;
      ttsAudio.volume = 1.0;

      if (audioPlayer && !audioPlayer.paused) {
        audioPlayer.volume = 0.22;
      }

      ttsAudio.play().then(() => {
        audioUnlocked = true;
      }).catch(() => {});

      const onTtsFinished = () => {
        if (audioPlayer && !audioPlayer.paused) {
          audioPlayer.volume = 0.85;
        }
        isPlayingTts = false;
        processTtsQueue();
      };
      ttsAudio.onended = onTtsFinished;
      ttsAudio.onerror = onTtsFinished;
    }

    // 布局模式切换
    const switchDisplayModeBtn = document.getElementById('switchDisplayModeBtn');
    function applyDisplayMode(mode) {
      document.body.classList.remove('mode-combo', 'mode-fish', 'mode-girl');
      document.body.classList.add('mode-' + mode);
      const label = switchDisplayModeBtn ? switchDisplayModeBtn.querySelector('span') : null;
      if (label) {
        if (mode === 'combo') label.innerText = '双模同台';
        else if (mode === 'girl') label.innerText = '舞娘独秀';
        else label.innerText = '萌鱼独秀';
      }
    }
    if (switchDisplayModeBtn) {
      switchDisplayModeBtn.addEventListener('click', () => {
        currentModeIndex = (currentModeIndex + 1) % displayModes.length;
        applyDisplayMode(displayModes[currentModeIndex]);
      });
    }

    // 背景模式切换（实景 / 绿幕 / 透明）
    const switchBgBtn = document.getElementById('switchBgBtn');
    function applyBgMode(mode) {
      document.body.classList.remove('bg-aquarium', 'bg-green', 'bg-transparent');
      document.body.classList.add('bg-' + mode);
      const label = switchBgBtn ? switchBgBtn.querySelector('span') : null;
      if (label) {
        if (mode === 'aquarium') label.innerText = '背景: 实景';
        else if (mode === 'green') label.innerText = '背景: 绿幕';
        else label.innerText = '背景: 透明';
      }
    }
    if (switchBgBtn) {
      switchBgBtn.addEventListener('click', () => {
        currentBgIndex = (currentBgIndex + 1) % bgModes.length;
        applyBgMode(bgModes[currentBgIndex]);
      });
    }

    // 纯净推流模式 (按 H 键切换)
    const hideUiBtn = document.getElementById('hideUiBtn');
    function toggleCleanMode() {
      document.body.classList.toggle('clean-mode');
    }
    if (hideUiBtn) hideUiBtn.addEventListener('click', toggleCleanMode);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        if (tag !== 'input' && tag !== 'textarea') {
          toggleCleanMode();
        }
      }
    });

    // 实时时间
    function updateClock() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const str = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const el = document.getElementById('liveClockTime');
      if (el) el.innerText = str;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 居中提示
    let toastTimeout = null;
    function showEventToast(text) {
      const toast = document.getElementById('liveEventToast');
      const textEl = document.getElementById('eventToastText');
      if (!toast || !textEl) return;
      textEl.innerText = text;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 3200);
    }

    // 主播字幕与动作联动
    let speechTimer = null;
    function showSpeech(speaker, text) {
      const subtitle = document.getElementById('douyinSubtitle');
      const speakerEl = document.getElementById('subtitleSpeaker');
      const textEl = document.getElementById('douyinSubtitleText');
      const animeFrame = document.getElementById('avatarFrame');
      const girlFrame = document.getElementById('girlFrame');

      if (speakerEl) speakerEl.innerText = speaker || '大肥鱼';
      if (textEl) textEl.innerText = text;
      if (subtitle) subtitle.style.opacity = '1';

      if (animeFrame) animeFrame.classList.add('whale-talking');
      if (girlFrame) girlFrame.classList.add('girl-talking');

      if (speechTimer) clearTimeout(speechTimer);
      const duration = Math.max(3800, (text || '').length * 260);
      speechTimer = setTimeout(() => {
        if (animeFrame) animeFrame.classList.remove('whale-talking');
        if (girlFrame) girlFrame.classList.remove('girl-talking');
        if (subtitle) subtitle.style.opacity = '0.82';
      }, duration);
    }

    // 弹幕上屏
    function addDanmu(user, text, type = 'normal') {
      const stream = document.getElementById('danmuStream');
      if (!stream) return;
      const item = document.createElement('div');
      item.className = 'danmu-item' + (type === 'gift' ? ' is-gift' : type === 'join' ? ' is-join' : '');
      item.innerHTML = `<span class="danmu-user">${escapeHtml(user)}</span><span>${escapeHtml(text)}</span>`;
      stream.appendChild(item);
      while (stream.children.length > 10) {
        stream.removeChild(stream.firstChild);
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 体重与进化条更新
    function updateEvolutionUI(state) {
      if (!state) return;
      const badge = document.getElementById('evoLevelBadge');
      const val = document.getElementById('evoValText');
      const fill = document.getElementById('evoProgressFill');
      if (badge && state.level_name) badge.innerText = state.level_name;
      if (val) val.innerText = `${state.current_weight} / ${state.target_weight} 斤`;
      if (fill && state.target_weight > 0) {
        const pct = Math.min(100, Math.round((state.current_weight / state.target_weight) * 100));
        fill.style.width = pct + '%';
      }
    }

    let localWeight = 180;
    function feedFish(delta = 10) {
      localWeight += delta;
      updateEvolutionUI({
        current_weight: localWeight,
        target_weight: 500,
        level_name: localWeight >= 500 ? 'Lv.2 傲娇暴食肥鱼' : 'Lv.1 呆萌幼鲸'
      });
    }

    // 音乐播放系统
    function playNextSong() {
      if (songQueue.length === 0) {
        isPlayingSong = false;
        currentPlayingSong = null;
        updateQueueUI();
        playDefaultMusic();
        return;
      }

      isPlayingSong = true;
      currentPlayingSong = songQueue.shift();
      updateQueueUI();

      audioPlayer.src = currentPlayingSong.url;
      audioPlayer.volume = 0.85;
      audioPlayer.play().then(() => {
        setPlayingVisual(true);
        document.getElementById('nowPlayingSongName').innerText = currentPlayingSong.title;
        document.getElementById('nowPlayingRequester').innerText = `点播: ${currentPlayingSong.user}`;
        showSpeech('大肥鱼', `正在播放【${currentPlayingSong.user}】点的《${currentPlayingSong.title}》。`);
      }).catch(() => {
        isPlayingSong = false;
        playNextSong();
      });
    }

    audioPlayer.addEventListener('ended', () => {
      if (isDancing) return;
      playNextSong();
    });

    function updateQueueUI() {
      const badge = document.getElementById('queueCountBadge');
      const list = document.getElementById('queueList');
      if (badge) badge.innerText = `${songQueue.length} 首`;
      if (!list) return;
      if (songQueue.length === 0) {
        list.innerHTML = '<div class="queue-empty-tip">公屏发「点歌 歌名」即可排队点播</div>';
        return;
      }
      list.innerHTML = songQueue.map((s, idx) => `
        <div class="queue-item">
          <span class="queue-item-name">${idx + 1}. ${escapeHtml(s.title)}</span>
          <span class="queue-item-user">${escapeHtml(s.user)}</span>
        </div>
      `).join('');
    }

    async function requestSong(songName, userName) {
      showEventToast(`收到 ${userName} 点歌：${songName}`);
      try {
        const res = await fetch(`/api/search_song?q=${encodeURIComponent(songName)}`);
        const data = await res.json();
        if (data.ok && data.url) {
          const item = {
            title: data.title || songName,
            url: data.url,
            user: userName,
            source: data.source || 'local'
          };
          songQueue.push(item);
          if (!isPlayingSong || (currentPlayingSong && currentPlayingSong.user === '精选电台')) {
            playNextSong();
          } else {
            updateQueueUI();
            showSpeech('大肥鱼', `收到【${userName}】点的《${item.title}》，已加入排队第 ${songQueue.length} 位。`);
          }
        } else {
          showSpeech('大肥鱼', `曲库里暂未找到《${songName}》，换一首试试吧。`);
        }
      } catch (err) {
        console.error('点歌请求异常:', err);
      }
    }

    window.quickPlaySong = function(name) {
      unlockAudio();
      requestSong(name, '主播点播');
    };

    const skipSongBtn = document.getElementById('skipSongBtn');
    if (skipSongBtn) {
      skipSongBtn.addEventListener('click', () => {
        unlockAudio();
        showEventToast('已切到下一首');
        playNextSong();
      });
    }

    const feedFishBtn = document.getElementById('feedFishBtn');
    if (feedFishBtn) {
      feedFishBtn.addEventListener('click', async () => {
        unlockAudio();
        try {
          await fetch('/api/feed_fish', { method: 'POST' });
        } catch (e) {
          feedFish(10);
        }
        showEventToast('投喂成功，体重 +10 斤');
      });
    }

    const broadcastRuleBtn = document.getElementById('broadcastRuleBtn');
    if (broadcastRuleBtn) {
      broadcastRuleBtn.addEventListener('click', async () => {
        unlockAudio();
        try {
          await fetch('/api/trigger_rule', { method: 'POST' });
        } catch (e) {
          showSpeech('大肥鱼', '欢迎来到大肥鱼直播间，公屏发送「点歌 歌名」即可免费点播。');
        }
      });
    }

    // 猜歌系统
    const triggerGuessBtn = document.getElementById('triggerGuessBtn');
    async function startGuessSong() {
      const banner = document.getElementById('guessSongBanner');
      const timerText = document.getElementById('guessTimerText');
      const hintText = document.getElementById('guessHintText');
      const progressInner = document.getElementById('guessProgressInner');

      try {
        const res = await fetch('/api/get_guess_song');
        const data = await res.json();
        if (data.ok && data.url) {
          currentGuessSong = data;
          banner.style.display = 'block';
          timerText.innerText = '20s';
          hintText.innerText = `提示：${data.hint || '热门金曲'}`;
          audioPlayer.src = data.url;
          audioPlayer.play().then(() => setPlayingVisual(true)).catch(() => {});
          showSpeech('大肥鱼', '猜歌挑战开始，前奏播放中，第一个在公屏答对歌名获胜。');

          progressInner.style.transition = 'none';
          progressInner.style.width = '100%';
          void progressInner.offsetWidth;
          progressInner.style.transition = 'width 20s linear';
          progressInner.style.width = '0%';

          let timeLeft = 20;
          if (guessTimer) clearInterval(guessTimer);
          guessTimer = setInterval(() => {
            timeLeft--;
            timerText.innerText = `${timeLeft}s`;
            if (timeLeft <= 0) {
              clearInterval(guessTimer);
              banner.style.display = 'none';
              showSpeech('大肥鱼', `时间到，这首歌是《${data.title}》。`);
              currentGuessSong = null;
              playNextSong();
            }
          }, 1000);
        }
      } catch (e) {
        console.error('猜歌发起失败:', e);
      }
    }
    if (triggerGuessBtn) {
      triggerGuessBtn.addEventListener('click', () => {
        unlockAudio();
        startGuessSong();
      });
    }

    // WebSocket 实时通信
    function connectWS() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${window.location.host}/ws`);
      ws.onmessage = (event) => {
        try {
          handleLiveEvent(JSON.parse(event.data));
        } catch (e) {}
      };
      ws.onclose = () => setTimeout(connectWS, 3000);
    }

    function handleLiveEvent(data) {
      if (!data) return;

      if (data.type === 'reply' || data.type === 'ai_reply') {
        showSpeech('大肥鱼', data.text);
        if (data.audio_url) playTtsAudio(data.audio_url);
      } else if (data.type === 'music_play') {
        if (data.song && data.song.url) {
          const item = {
            title: data.song.name || '热门歌曲',
            url: data.song.url,
            user: data.username || '观众',
            source: data.is_local ? 'local' : 'muse'
          };
          songQueue.push(item);
          if (!isPlayingSong || (currentPlayingSong && currentPlayingSong.user === '精选电台')) {
            playNextSong();
          } else {
            updateQueueUI();
          }
        }
      } else if (data.type === 'music_skip') {
        playNextSong();
      } else if (data.type === 'danmu' || data.type === 'chat') {
        const user = data.username || data.user || '观众';
        const text = data.content || data.text || '';
        addDanmu(user, text);

        if (text.startsWith('点歌') || text.startsWith('我想听')) {
          const songName = text.replace(/^(点歌|我想听)\s*/, '').trim();
          if (songName) requestSong(songName, user);
        } else if (text === '切歌' || text === '下一首') {
          playNextSong();
        } else if (text === '投喂' || text.includes('小鱼干')) {
          feedFish(5);
          showEventToast(`${user} 投喂小鱼干，体重 +5 斤`);
        } else if (text === '猜歌') {
          startGuessSong();
        } else if (text.includes('跳舞') || text.includes('极乐净土')) {
          startDance(25);
        }

        if (currentGuessSong && text.includes(currentGuessSong.title)) {
          clearInterval(guessTimer);
          document.getElementById('guessSongBanner').style.display = 'none';
          showEventToast(`恭喜 ${user} 猜中《${currentGuessSong.title}》`);
          showSpeech('大肥鱼', `恭喜【${user}】猜对《${currentGuessSong.title}》！`);
          currentGuessSong = null;
        }
      } else if (data.type === 'join' || (data.type === 'viewer_event' && data.event === 'join')) {
        const user = data.username || data.user || '新朋友';
        addDanmu(user, '进入了直播间', 'join');
      } else if (data.type === 'like' || data.type === 'like_burst') {
        const user = data.username || data.user || '观众';
        feedFish(1);
        showEventToast(`${user} 点赞了直播间`);
      } else if (data.type === 'gift') {
        const user = data.username || data.user || '老板';
        const count = data.count || 1;
        feedFish(50 * count);
        startDance(20, '庆典热舞');
        addDanmu(user, `送出 ${data.gift_name || data.content || '礼物'} x${count}`, 'gift');
        showEventToast(`感谢 ${user} 送出的礼物`);
        document.getElementById('throneUser').innerText = user;
        document.getElementById('throneScore').innerText = `${count * 10} 鱼干`;
      } else if (data.type === 'evolution_update' && data.state) {
        updateEvolutionUI(data.state);
      } else if (data.type === 'champion_update') {
        if (data.username) document.getElementById('throneUser').innerText = data.username;
        if (data.contribution !== undefined) document.getElementById('throneScore').innerText = `${data.contribution} 鱼干`;
      }
    }

    // 弹幕发送
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    function sendLocalMsg() {
      const text = msgInput.value.trim();
      if (!text) return;
      msgInput.value = '';
      unlockAudio();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'danmu', user: '主播', text: text }));
      } else {
        handleLiveEvent({ type: 'danmu', user: '主播', text: text });
      }
    }
    if (sendBtn) sendBtn.addEventListener('click', sendLocalMsg);
    if (msgInput) {
      msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendLocalMsg();
      });
    }

    // 点击大肥鱼互动
    const avatarFrame = document.getElementById('avatarFrame');
    if (avatarFrame) {
      avatarFrame.addEventListener('click', () => {
        feedFish(10);
        showEventToast('投喂大肥鱼 +10 斤');
        showSpeech('大肥鱼', '别乱戳呀，记得给本鱼投喂小鱼干。');
      });
    }

    // 鼠标微视差
    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      const fishImg = document.getElementById('animeImage');
      if (fishImg) {
        fishImg.style.transform = `perspective(800px) rotateY(${x * 12}deg) rotateX(${-y * 10}deg)`;
      }
      const girlImg = document.getElementById('girlImage');
      if (girlImg && girlImg.style.display !== 'none') {
        girlImg.style.transform = `perspective(800px) rotateY(${x * 12}deg) rotateX(${-y * 10}deg)`;
      }
    });

    // 3D 舞蹈控制
    let isDancing = false;
    let danceTimer = null;
    const danceBtn = document.getElementById('danceBtn');
    const stagePartyLights = document.getElementById('stagePartyLights');

    function startDance(durationSec = 25, songTitle = '极乐净土') {
      if (isDancing) {
        showEventToast('热舞进行中');
        return;
      }
      isDancing = true;
      if (danceBtn) {
        danceBtn.classList.add('active');
        const sp = danceBtn.querySelector('span');
        if (sp) sp.innerText = '热舞中';
      }
      if (stagePartyLights) stagePartyLights.classList.add('active');

      const girlF = document.getElementById('girlFrame');
      if (avatarEngineMode === '3d' && window.play3DCharacterDance) {
        window.play3DCharacterDance();
      } else if (girlF) {
        girlF.classList.add('girl-dancing');
      }

      showEventToast(`开启热舞：${songTitle}`);
      showSpeech('大肥鱼', '音乐响起来，极乐净土安排上。');

      audioPlayer.src = '/local_music/%E6%9E%81%E4%B9%90%E5%87%80%E5%9C%9F.mp3';
      audioPlayer.volume = 0.9;
      audioPlayer.play().then(() => setPlayingVisual(true)).catch(() => {});

      const disc = document.getElementById('vinylDisc');
      if (disc) disc.style.animationDuration = '2s';
      document.getElementById('nowPlayingSongName').innerText = songTitle;
      document.getElementById('nowPlayingRequester').innerText = '热舞伴奏';

      if (danceTimer) clearTimeout(danceTimer);
      danceTimer = setTimeout(stopDance, durationSec * 1000);
    }

    function stopDance() {
      if (!isDancing) return;
      isDancing = false;
      if (danceBtn) {
        danceBtn.classList.remove('active');
        const sp = danceBtn.querySelector('span');
        if (sp) sp.innerText = '热舞';
      }
      if (stagePartyLights) stagePartyLights.classList.remove('active');

      const girlF = document.getElementById('girlFrame');
      if (girlF) girlF.classList.remove('girl-dancing');
      if (window.stop3DCharacterDance) window.stop3DCharacterDance();

      const disc = document.getElementById('vinylDisc');
      if (disc) disc.style.animationDuration = '6s';

      playNextSong();
    }

    if (danceBtn) {
      danceBtn.addEventListener('click', () => {
        unlockAudio();
        if (isDancing) {
          clearTimeout(danceTimer);
          stopDance();
          return;
        }
        if (avatarEngineMode !== '3d') applyAvatarEngineMode('3d');
        startDance(30);
      });
    }

    // 3D舞娘 / 原画形象切换
    let avatarEngineMode = localStorage.getItem('avatar_engine_mode') || '3d';
    const switchAvatarBtn = document.getElementById('switchAvatarEngineBtn');

    function applyAvatarEngineMode(mode) {
      avatarEngineMode = mode;
      localStorage.setItem('avatar_engine_mode', mode);
      const canvas3D = document.getElementById('threeStageCanvas');
      const girlImg = document.getElementById('girlImage');
      const label = switchAvatarBtn ? switchAvatarBtn.querySelector('span') : null;

      if (mode === '3d') {
        if (label) label.innerText = '3D舞娘';
        if (switchAvatarBtn) switchAvatarBtn.classList.add('active');
        if (canvas3D) canvas3D.style.display = 'block';
        if (girlImg) girlImg.style.display = 'none';
      } else {
        if (label) label.innerText = '原画形象';
        if (switchAvatarBtn) switchAvatarBtn.classList.remove('active');
        if (canvas3D) canvas3D.style.display = 'none';
        if (girlImg) girlImg.style.display = 'block';
      }
    }

    if (switchAvatarBtn) {
      switchAvatarBtn.addEventListener('click', () => {
        applyAvatarEngineMode(avatarEngineMode === '3d' ? 'classic' : '3d');
      });
    }
    applyAvatarEngineMode(avatarEngineMode);

    function tryInit3D() {
      if (window.init3DStage) window.init3DStage();
      else setTimeout(tryInit3D, 200);
    }
    tryInit3D();

    window.on3DModelReady = function() {
      if (avatarEngineMode === '3d') {
        const girlImg = document.getElementById('girlImage');
        if (girlImg) girlImg.style.display = 'none';
      }
    };

    connectWS();
  </script>
</body>
</html>
